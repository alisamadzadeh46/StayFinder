version: '3.9'

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       stayfinder
      POSTGRES_USER:     stayfinder
      POSTGRES_PASSWORD: stayfinder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Build React and copy to backend/static/frontend
  frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_build:/static

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      frontend-builder:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - media_files:/app/media
      - frontend_build:/app/static/frontend   # React build served by Django
    ports:
      - "8000:8000"
    environment:
      DEBUG:             "True"
      SECRET_KEY:        "dev-secret-key-change-in-production"
      POSTGRES_DB:       stayfinder
      POSTGRES_USER:     stayfinder
      POSTGRES_PASSWORD: stayfinder
      POSTGRES_HOST:     db
      POSTGRES_PORT:     "5432"
      REDIS_URL:         redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      SITE_URL:          http://localhost:8000
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_data || true &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    environment:
      DEBUG:             "True"
      SECRET_KEY:        "dev-secret-key-change-in-production"
      POSTGRES_DB:       stayfinder
      POSTGRES_USER:     stayfinder
      POSTGRES_PASSWORD: stayfinder
      POSTGRES_HOST:     db
      CELERY_BROKER_URL: redis://redis:6379/0
    command: celery -A config worker --loglevel=info --concurrency=2

volumes:
  postgres_data:
  media_files:
  frontend_build:
